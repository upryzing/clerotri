// from https://blog.uint.dev/rb-build-id/

interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

def home = System.getenv("ANDROID_HOME") ?: ""
println "[strip-build-ids] ANDROID_HOME environment variable value: ${home}"
def objcopy = null
if (home) {
    def ndkRoot = new File("${home}/ndk")
    if (ndkRoot.isDirectory()) {
        ndkRoot.eachDir { ver ->
            if (objcopy) return
            println "[strip-build-ids] first path to check for llvm-objcopy: ${ver}/toolchains/llvm/prebuilt"
            def prebuilt = new File("${ver}/toolchains/llvm/prebuilt")
            if (!prebuilt.isDirectory()) return
            prebuilt.eachDir { platform ->
                if (objcopy) return
                println "[strip-build-ids] second path to check for llvm-objcopy: ${platform}/bin/llvm-objcopy"
                def c = new File("${platform}/bin/llvm-objcopy")
                if (c.exists()) objcopy = c.absolutePath
            }
        }
    }
}
if (!objcopy) {
    println "[strip-build-ids] llvm-objcopy not found - skipping build ID stripping"
    return
}
final String oc = objcopy

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("NativeLibs") }
    .configureEach { t ->
        t.doLast {
            def injected = project.objects.newInstance(InjectedExecOps)
            t.outputs.files.each { dir ->
                if (!(dir instanceof File) || !dir.isDirectory()) return
                dir.eachFileRecurse { f ->
                    if (!f.name.endsWith('.so')) return
                    try {
                        injected.execOps.exec { commandLine oc, '--remove-section', '.note.gnu.build-id', f.absolutePath }
                        // println "[strip-build-ids] stripped build ID from ${f.name}"
                    } catch ( e ) {
                        throw StopExecutionException( "${e.message}" )
                    }
                }
            }
            println "[strip-build-ids] stripped build IDs from native libraries"
        }
    }


